name: eval

# Gates every change on the evaluation source of truth and the safety graders.
# Nothing here needs a secret: the eval gate is pure stdlib Python over committed
# artifacts, and the frontend build type checks without an Anthropic key (the key
# is only read at request time).

on:
  push:
    branches: [main]
  pull_request:

jobs:
  evals:
    name: Eval provenance + regression gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Fails if data/evals.json is stale, if a headline metric lacks a backing
      # record, or if a measured metric dropped below its committed floor.
      - name: Gate frontend/data/evals.json
        run: python3 ml/run_evals.py --check

  frontend:
    name: Graders + typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Guardrail red team
        run: npm run grade-guardrails
      - name: Harness suite
        run: npm run grade-harness
      - name: Typecheck + build
        run: npm run build
